<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEDATU - Sistema de Detección de Necesidades de Capacitación 2027</title>
<style>
  :root{
    --teal-900:#0f3d3a; --teal-800:#12524d; --teal-700:#166a63;
    --amber-600:#c08a28; --amber-700:#9c6f1f; --amber-50:#fdf6e8; --amber-200:#eed6a5;
    --stone-50:#faf9f7; --stone-100:#f2f0ec; --stone-200:#e4e1da; --stone-300:#cfcabf;
    --stone-400:#a39c8c; --stone-500:#79715f; --stone-600:#5b5546; --stone-700:#453f34;
    --stone-800:#2b2620; --emerald-50:#eafaf1; --emerald-100:#d4f3e2; --emerald-600:#1f7a4d; --emerald-700:#166339;
    --red-50:#fdecec; --red-200:#f3bcbc; --red-700:#a3231d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--stone-50); color:var(--stone-800);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.5;
  }
  #root{min-height:100%; display:flex; flex-direction:column;}
  .header{background:var(--teal-900); color:#e7f3f1;}
  .header-stripe{height:6px; width:100%; background:linear-gradient(to right, var(--amber-600), var(--teal-700), var(--amber-600));}
  .header-inner{max-width:860px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between;}
  .header-eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:#9fc9c3;}
  .header-title{font-weight:600; font-size:18px; letter-spacing:-.01em; line-height:1.2;}
  .btn-ghost{font-size:12px; padding:6px 12px; border-radius:6px; border:1px solid var(--teal-700); background:transparent; color:#e7f3f1; cursor:pointer;}
  .btn-ghost:hover{background:var(--teal-800);}
  .container{max-width:860px; width:100%; margin:0 auto; padding:32px 24px; flex:1;}
  .footer{text-align:center; font-size:12px; color:var(--stone-400); padding:24px 0;}
  .stepper{display:flex; align-items:center; width:100%; margin-bottom:8px;}
  .step{display:flex; align-items:center; gap:8px; flex:1;}
  .step:last-child{flex:none;}
  .step-badge{display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:999px; font-size:12px; font-weight:600; border:2px solid var(--stone-300); color:var(--stone-400); background:#fff; flex-shrink:0;}
  .step-badge.active{border-color:var(--amber-600); color:var(--amber-700); background:var(--amber-50);}
  .step-badge.done{border-color:var(--teal-800); background:var(--teal-800); color:#fff;}
  .step-label{font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; color:var(--stone-400); display:none;}
  .step-label.active{color:var(--amber-700);}
  .step-label.done{color:var(--teal-800);}
  @media (min-width:560px){.step-label{display:inline;}}
  .step-line{flex:1; height:1px; margin:0 12px; background:var(--stone-300);}
  .step-line.done{background:var(--teal-800);}
  .card{background:#fff; border:1px solid var(--stone-200); border-radius:8px; box-shadow:0 1px 2px rgba(0,0,0,.04); padding:24px;}
  .card + .card{margin-top:24px;}
  .card-title{display:flex; align-items:center; gap:8px; margin:0 0 4px 0; font-weight:600; font-size:16px;}
  .card-subtitle{font-size:13px; color:var(--stone-500); margin:0 0 16px 0;}
  .field-label{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--stone-500); margin-bottom:4px;}
  .field-value{font-size:14px; color:var(--stone-800);}
  input[type=text],input[type=password],select{
    width:100%; border:1px solid var(--stone-300); border-radius:6px; padding:9px 12px; font-size:14px; font-family:inherit; color:var(--stone-800); background:#fff;
  }
  input:focus,select:focus{outline:2px solid var(--teal-700); outline-offset:1px; border-color:var(--teal-700);}
  .icon-input{position:relative;}
  .icon-input input{padding-left:34px;}
  .icon-input .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--stone-400);}
  .btn{width:100%; font-size:14px; font-weight:500; padding:10px 16px; border-radius:6px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;}
  .btn-primary{background:var(--teal-800); color:#fff;}
  .btn-primary:hover{background:var(--teal-900);}
  .btn-primary:disabled{background:var(--stone-200); color:var(--stone-400); cursor:not-allowed;}
  .btn-secondary{background:var(--stone-100); color:var(--stone-700);}
  .btn-secondary:hover{background:var(--stone-200);}
  .btn-row{display:flex; gap:12px;}
  .btn-row .btn{flex:1;}
  .alert{display:flex; align-items:flex-start; gap:8px; font-size:13px; padding:10px 12px; border-radius:6px;}
  .alert-error{color:var(--red-700); background:var(--red-50); border:1px solid var(--red-200);}
  .alert-warn{color:var(--amber-700); background:var(--amber-50); border:1px solid var(--amber-200);}
  .alert-ok{align-items:center; color:var(--emerald-700); background:var(--emerald-50); border:1px solid var(--emerald-100);}
  .grid2{display:grid; grid-template-columns:1fr; gap:16px;}
  @media (min-width:600px){.grid2{grid-template-columns:1fr 1fr;}}
  .col-span-2{grid-column:1 / -1;}
  .course-selection-box{background:var(--stone-50); border:1px solid var(--stone-200); border-radius:8px; padding:16px; margin-bottom:16px;}
  .course-selection-title{font-size:13px; font-weight:700; color:var(--teal-900); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
  .info-tag-box{background:#fff; border:1px solid var(--stone-200); border-left:3px solid var(--teal-700); padding:10px 12px; border-radius:4px; margin-top:12px; font-size:13px;}
  .test-accounts{margin-top:24px; border-top:1px solid var(--stone-100); padding-top:16px;}
  .test-accounts-title{font-size:12px; color:var(--stone-400); margin-bottom:8px;}
  .test-accounts ul{list-style:none; margin:0; padding:0; font-size:12px; color:var(--stone-500); display:flex; flex-direction:column; gap:4px;}
  .link-btn{background:none; border:none; padding:0; color:inherit; text-decoration:underline dotted; cursor:pointer; font-size:inherit; font-family:inherit;}
  .link-btn:hover{color:var(--teal-800);}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--stone-400); border-bottom:1px solid var(--stone-200); padding:8px 8px 8px 0;}
  td{padding:8px 8px 8px 0; border-bottom:1px solid var(--stone-100);}
  tr:last-child td{border-bottom:none;}
  .empty-box{font-size:13px; color:var(--stone-400); font-style:italic; border:1px dashed var(--stone-200); border-radius:6px; padding:12px 16px;}
  .badge{font-size:11px; font-weight:600; padding:4px 10px; border-radius:999px;}
  .badge-ok{background:var(--emerald-100); color:var(--emerald-700);}
  .badge-neutral{background:var(--stone-100); color:var(--stone-600);}
  .oblig-box{border:1px solid var(--amber-200); background:var(--amber-50); border-radius:6px; padding:12px 16px;}
  .oblig-tag{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--amber-700); font-weight:600; margin-bottom:4px;}
  .norm-box{font-size:12px; color:var(--stone-500); background:var(--stone-50); border:1px dashed var(--stone-300); border-radius:6px; padding:12px 16px; line-height:1.6;}
  .total-bar{background:var(--stone-100); border:1px solid var(--stone-200); border-radius:8px; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; font-size:14px; color:var(--stone-600);}
  .doc-header{display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--stone-200); padding-bottom:16px; margin-bottom:20px;}
  .doc-eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--stone-400);}
  .doc-title{font-weight:600; font-size:16px; margin:2px 0 0 0;}
  .doc-meta{text-align:right; font-size:12px; color:var(--stone-500);}
  .signature-row{display:grid; grid-template-columns:1fr 1fr; gap:32px; margin-top:40px;}
  .signature-box{text-align:center; border-top:1px solid var(--stone-400); padding-top:8px;}
  .signature-name{font-size:14px; color:var(--stone-800); min-height:20px;}
  .signature-label{font-size:11px; color:var(--stone-500); margin-top:4px;}
  .mb-1{margin-bottom:4px;} .mb-2{margin-bottom:8px;} .mb-4{margin-bottom:16px;} .mb-6{margin-bottom:24px;} .mb-8{margin-bottom:32px;}
  .mt-2{margin-top:8px;} .mt-4{margin-top:16px;} .mt-8{margin-top:32px;} .mt-10{margin-top:40px;}
  svg.ic{width:16px; height:16px; flex-shrink:0;}
  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .card{border:none !important; box-shadow:none !important; padding:0 !important;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
"use strict";

/* ============================================================

   ============================================================ */
function icon(paths) {

var ICONS = {

  check: icon('<circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/>'),
  alert: icon('<circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/>'),

  logout: icon('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>'),
  info: icon('<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>'),
  shield: icon('<path d="M12 3l7 3v6c0 5-3 8-7 9-4-1-7-4-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/>'),
  chevron: icon('<path d="M9 6l6 6-6 6"/>'),
  printer: icon('<path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M6 17h12v4H6z"/>'),
  pen: icon('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>')
};

/* ============================================================
   DATOS BASE (CATÁLOGO MULTI-PLATAFORMA Y PLANTILLA)
   ============================================================ */
var EMPLEADOS = [
  { curp: "GARM850101HDFRZL05", numEmpleado: "10234", nombre: "Maria Elena Garcia Ruiz", puesto: "Jefa de Departamento", nivel: "OA1", area: "Direccion General de Ordenamiento Territorial y Agrario" },
  { curp: "LOHJ900312HDFPRN08", numEmpleado: "10567", nombre: "Juan Carlos Lopez Hernandez", puesto: "Subdirector de Area", nivel: "NA1", area: "Direccion General de Desarrollo Urbano, Suelo y Vivienda" },
  { curp: "RAMS930725MDFYRN02", numEmpleado: "10891", nombre: "Sofia Ramirez Mendoza", puesto: "Enlace de Alto Nivel de Responsabilidad", nivel: "OB1", area: "Direccion General de Administracion y Finanzas" }
];

var CURSOS_2026 = {
  10234: [
    { nombre: "Ética, práctica y mística en el servicio público", horas: 10, periodo: "Marzo 2026" },
    { nombre: "Introducción a la ciberseguridad", horas: 06, periodo: "Julio 2026" }
  ],
  10567: [{ nombre: "Igualdad de Genero y No Discriminacion", horas: 8, periodo: "Febrero 2026" }],
  10891: []
};

var OBLIGATORIOS_2027 = [
  { nombre: "Obligatorio 1", horas: 8, modalidad: "En linea", plataforma: "Escuela de Buen Gobierno" },
  { nombre: "Formación en Igualdad Sustantiva y derechos de las mujeres", horas: 10, modalidad: "En linea", plataforma: "Escuela de Buen Gobierno" }
];

var CATALOGO_2027 = [
  {
    id: 1,
    categoria: "Habilidades Blandas",
    nombre: "Trabajo en Equipo y Colaboracion",
    plataforma: "PROCADIST",
    necesidad: "Fomentar la coordinacion interinstitucional y resolucion constructiva de acuerdos grupales.",
    horas: 16,
    modalidad: "En linea"
  },
  {
    id: 2,
    categoria: "Habilidades Blandas",
    nombre: "Trabajo en Equipo y Colaboracion",
    plataforma: "Capacitate para el Empleo (Fundacion Carlos Slim)",
    necesidad: "Fortalecer habilidades operativas, distribucion eficiente de tareas y liderazgo sinergico.",
    horas: 20,
    modalidad: "En linea"
  },
  {
    id: 3,
    categoria: "Habilidades Blandas",
    nombre: "Comunicacion Asertiva y Negociacion",
    plataforma: "PROCADIST",
    necesidad: "Mejorar la gestion de acuerdos y comunicacion clara con representaciones agrarias y comites.",
    horas: 15,
    modalidad: "En linea"
  },
  {
    id: 4,
    categoria: "Tecnologia y Productividad",
    nombre: "Analisis de Datos con Microsoft Excel",
    plataforma: "Capacitate para el Empleo (Fundacion Carlos Slim)",
    necesidad: "Depuracion masiva de bases registrales y cruces automaticos de beneficiarios.",
    horas: 25,
    modalidad: "En linea"
  },
  {
    id: 5,
    categoria: "Tecnologia y Productividad",
    nombre: "Analisis de Datos con Microsoft Excel",
    plataforma: "MexicoX",
    necesidad: "Gestion cuantitativa de indicadores de seguimiento territorial y matrices analiticas.",
    horas: 30,
    modalidad: "En linea"
  },
  {
    id: 6,
    categoria: "Normatividad y Gestion Publica",
    nombre: "Marco Juridico del Ordenamiento Territorial",
    plataforma: "Campus SEDATU / INDESOL",
    necesidad: "Actualizacion de criterios normativos para la regularizacion de asentamientos humanos.",
    horas: 24,
    modalidad: "Mixta"
  },
  {
    id: 7,
    categoria: "Normatividad y Gestion Publica",
    nombre: "Redaccion de Documentos Oficiales y Archivo",
    plataforma: "PROCADIST",
    necesidad: "Estandarizar notas informativas, oficios de respuesta y dictamenes tecnicos sectoriales.",
    horas: 20,
    modalidad: "En linea"
  },
  {
    id: 8,
    categoria: "Derechos Humanos y Genero",
    nombre: "Inclusion, No Discriminacion e Igualdad Sustantiva",
    plataforma: "Campus CONAPRED",
    necesidad: "Garantizar la transversalizacion de perspectiva de derechos y no discriminacion en proyectos urbanos.",
    horas: 20,
    modalidad: "En linea"
  }
];

var HORAS_MINIMAS_REQUERIDAS = 40;

/* ============================================================
   ESTADO
   ============================================================ */
var state = {
  page: "login",
  curp: "",
  numEmpleado: "",
  loginError: "",
  user: null,
  
  // Selecciones Optativo 1
  c1_cat: "",
  c1_nom: "",
  c1_id: "",

  // Selecciones Optativo 2
  c2_cat: "",
  c2_nom: "",
  c2_id: "",

  jefeInmediato: "",
  record: null
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function getCursosTomados2026(user) {
  return user ? (CURSOS_2026[user.numEmpleado] || []) : [];
}

function getDisponibles2027(user) {
  var tomados = {};
  getCursosTomados2026(user).forEach(function (c) { tomados[c.nombre] = true; });
  return CATALOGO_2027.filter(function (c) { return !tomados[c.nombre]; });
}

function getCategoriasDisponibles(disponibles) {
  var cats = {};
  disponibles.forEach(function (c) { cats[c.categoria] = true; });
  return Object.keys(cats).sort();
}

function getCursosPorCategoria(disponibles, cat) {
  if (!cat) return [];
  var nombres = {};
  disponibles.filter(function (c) { return c.categoria === cat; }).forEach(function (c) {
    nombres[c.nombre] = true;
  });
  return Object.keys(nombres).sort();
}

function getPlataformasPorCurso(disponibles, cat, nombre) {
  if (!cat || !nombre) return [];
  return disponibles.filter(function (c) {
    return c.categoria === cat && c.nombre === nombre;
  });
}

/* ============================================================
   RENDER: HEADER & STEPPER
   ============================================================ */
function renderHeader() {
  var logged = !!state.user;
  return (
    '<div class="header no-print">' +
      '<div class="header-stripe"></div>' +
      '<div class="header-inner">' +
        '<div>' +
          '<div class="header-eyebrow">SEDATU &middot; DNC Institucional</div>' +
          '<div class="header-title">Sistema de Deteccion de Necesidades de Capacitacion 2027</div>' +
        '</div>' +
        (logged ? '<button class="btn-ghost" data-action="logout">' + ICONS.logout + ' Salir</button>' : '') +
      '</div>' +
    '</div>'
  );
}

function renderStepper(current) {
  var steps = ["Acceso", "Perfil", "Solicitud", "Confirmacion"];
  var html = '<div class="stepper no-print">';
  steps.forEach(function (label, i) {
    var idx = i + 1;
    var active = idx === current, done = idx < current;
    var badgeClass = done ? "step-badge done" : active ? "step-badge active" : "step-badge";
    var labelClass = done ? "step-label done" : active ? "step-label active" : "step-label";
    html += '<div class="step">';
    html += '<div class="' + badgeClass + '">' + (done ? ICONS.check : idx) + '</div>';
    html += '<div class="' + labelClass + '">' + label + '</div>';
    html += '</div>';
    if (idx !== steps.length) html += '<div class="step-line' + (done ? ' done' : '') + '"></div>';
  });
  html += '</div>';
  return html;
}

/* ============================================================
   RENDER: PAGINAS
   ============================================================ */
function renderLogin() {
  var accountsHtml = EMPLEADOS.map(function (e) {
    return '<li><button type="button" class="link-btn" data-action="fill-account" data-curp="' + esc(e.curp) + '" data-num="' + esc(e.numEmpleado) + '">' +
      esc(e.curp) + ' &mdash; ' + esc(e.numEmpleado) + ' (' + esc(e.nombre.split(" ")[0]) + ')</button></li>';
  }).join("");

  return (
    '<div class="card" style="max-width:440px;margin:24px auto 0;">' +
      '<div class="card-title">' + ICONS.login + ' Acceso al sistema</div>' +
      '<p class="card-subtitle">Ingresa con tu CURP y tu numero de empleado como contrasena.</p>' +
      '<form id="login-form">' +
        '<div class="mb-4">' +
          '<div class="field-label">CURP</div>' +
          '<div class="icon-input">' +
            '<span class="ic">' + ICONS.user + '</span>' +
            '<input type="text" id="curp-input" maxlength="18" placeholder="GARM850101HDFRZL05" style="text-transform:uppercase;" value="' + esc(state.curp) + '" />' +
          '</div>' +
        '</div>' +
        '<div class="mb-4">' +
          '<div class="field-label">Numero de empleado (contrasena)</div>' +
          '<div class="icon-input">' +
            '<span class="ic">' + ICONS.key + '</span>' +
            '<input type="password" id="numempleado-input" placeholder="10234" value="' + esc(state.numEmpleado) + '" />' +
          '</div>' +
        '</div>' +
        (state.loginError ? '<div class="alert alert-error mb-4">' + ICONS.alert + '<span>' + esc(state.loginError) + '</span></div>' : '') +
        '<button type="submit" class="btn btn-primary">Iniciar sesion</button>' +
      '</form>' +
      '<div class="test-accounts">' +
        '<div class="test-accounts-title">Cuentas de prueba (maqueta institucional):</div>' +
        '<ul>' + accountsHtml + '</ul>' +
      '</div>' +
    '</div>'
  );
}

function renderPerfil() {
  var user = state.user;
  var cursos = getCursosTomados2026(user);
  var tablaHtml;
  if (cursos.length === 0) {
    tablaHtml = '<div class="empty-box">No se registra capacitacion tomada durante 2026.</div>';
  } else {
    tablaHtml = '<table><thead><tr><th>Curso tomado</th><th>Horas</th><th>Periodo</th></tr></thead><tbody>' +
      cursos.map(function (c) {
        return '<tr><td>' + esc(c.nombre) + '</td><td>' + c.horas + ' h</td><td style="color:var(--stone-500);">' + esc(c.periodo) + '</td></tr>';
      }).join("") + '</tbody></table>';
  }

  return (
    '<div class="card">' +
      '<div class="card-title">' + ICONS.user + ' Perfil del Servidor Publico</div>' +
      '<div class="grid2 mt-4">' +
        '<div><div class="field-label">Nombre</div><div class="field-value">' + esc(user.nombre) + '</div></div>' +
        '<div><div class="field-label">CURP</div><div class="field-value">' + esc(user.curp) + '</div></div>' +
        '<div><div class="field-label">Tipo de puesto</div><div class="field-value">' + esc(user.puesto) + '</div></div>' +
        '<div><div class="field-label">Nivel</div><div class="field-value">' + esc(user.nivel) + '</div></div>' +
        '<div class="col-span-2"><div class="field-label">Area de adscripcion</div><div class="field-value">' + esc(user.area) + '</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">' + ICONS.book + ' Historial de Capacitacion 2026</div>' +
      '<p class="card-subtitle">Verifica los cursos acreditados en el ciclo inmediato anterior. Los temas tomados se excluyen automaticamente de las opciones 2027.</p>' +
      tablaHtml +
    '</div>' +
    '<button class="btn btn-primary mt-4" data-action="go-solicitud">Confirmar datos y continuar ' + ICONS.chevron + '</button>'
  );
}

function renderCourseSelector(index, selectedCat, selectedNom, selectedId, otherId, disponibles) {
  var categories = getCategoriasDisponibles(disponibles);
  var names = getCursosPorCategoria(disponibles, selectedCat);
  var platforms = getPlataformasPorCurso(disponibles, selectedCat, selectedNom).filter(function (c) {
    return String(c.id) !== String(otherId);
  });

  var selectedCourse = disponibles.filter(function (c) { return String(c.id) === String(selectedId); })[0];

  var catOptions = '<option value="">-- Selecciona una Categoria --</option>' + categories.map(function (cat) {
    return '<option value="' + esc(cat) + '" ' + (cat === selectedCat ? 'selected' : '') + '>' + esc(cat) + '</option>';
  }).join("");

  var nomOptions = '<option value="">-- Selecciona un Curso --</option>' + names.map(function (n) {
    return '<option value="' + esc(n) + '" ' + (n === selectedNom ? 'selected' : '') + '>' + esc(n) + '</option>';
  }).join("");

  var platOptions = '<option value="">-- Selecciona Plataforma / Modalidad --</option>' + platforms.map(function (p) {
    return '<option value="' + p.id + '" ' + (String(p.id) === String(selectedId) ? 'selected' : '') + '>' + esc(p.plataforma) + ' (' + p.horas + ' h)</option>';
  }).join("");

  var detailBox = '';
  if (selectedCourse) {
    detailBox = 
      '<div class="info-tag-box">' +
        '<div><strong>Necesidad institucional que atiende:</strong></div>' +
        '<div style="color:var(--stone-600);margin-top:2px;">' + esc(selectedCourse.necesidad) + '</div>' +
        '<div style="margin-top:6px;display:flex;gap:12px;font-size:12px;">' +
          '<span><strong>Horas acreditadas:</strong> ' + selectedCourse.horas + ' h</span>' +
          '<span><strong>Modalidad:</strong> ' + esc(selectedCourse.modalidad) + '</span>' +
        '</div>' +
      '</div>';
  }

  return (
    '<div class="course-selection-box">' +
      '<div class="course-selection-title">' +
        '<span>Curso Optativo ' + index + '</span>' +
        (selectedCourse ? '<span class="badge badge-ok">' + selectedCourse.horas + ' horas</span>' : '<span class="badge badge-neutral">Pendiente</span>') +
      '</div>' +
      '<div class="grid2">' +
        '<div>' +
          '<div class="field-label">1. Categoria</div>' +
          '<select class="cat-select" data-slot="' + index + '">' + catOptions + '</select>' +
        '</div>' +
        '<div>' +
          '<div class="field-label">2. Nombre del Curso</div>' +
          '<select class="nom-select" data-slot="' + index + '" ' + (!selectedCat ? 'disabled' : '') + '>' + nomOptions + '</select>' +
        '</div>' +
        '<div class="col-span-2">' +
          '<div class="field-label">3. Plataforma de Imparticion</div>' +
          '<select class="id-select" data-slot="' + index + '" ' + (!selectedNom ? 'disabled' : '') + '>' + platOptions + '</select>' +
        '</div>' +
      '</div>' +
      detailBox +
    '</div>'
  );
}

function renderSolicitud() {
  var user = state.user;
  var disponibles = getDisponibles2027(user);

  var cursoOpt1 = disponibles.filter(function (c) { return String(c.id) === String(state.c1_id); })[0];
  var cursoOpt2 = disponibles.filter(function (c) { return String(c.id) === String(state.c2_id); })[0];

  var h1 = cursoOpt1 ? cursoOpt1.horas : 0;
  var h2 = cursoOpt2 ? cursoOpt2.horas : 0;
  var totalOpt = h1 + h2;
  var totalOblig = OBLIGATORIOS_2027.reduce(function (a, c) { return a + c.horas; }, 0);
  var totalGeneral = totalOblig + totalOpt;

  var cumpleMinimo = totalGeneral >= HORAS_MINIMAS_REQUERIDAS;
  var puedeEnviar = state.c1_id && state.c2_id && state.c1_id !== state.c2_id && cumpleMinimo;

  var obligHtml = OBLIGATORIOS_2027.map(function (c) {
    return '<div class="oblig-box"><div class="oblig-tag">Obligatorio</div><div class="field-value">' + esc(c.nombre) +
      '</div><div style="font-size:12px;color:var(--stone-500);margin-top:4px;">' + c.horas + ' h &middot; ' + esc(c.modalidad) + ' (' + esc(c.plataforma) + ')</div></div>';
  }).join("");

  var warnHtml = "";
  if (!cumpleMinimo) {
    var faltantes = HORAS_MINIMAS_REQUERIDAS - totalGeneral;
    warnHtml = '<div class="alert alert-warn mt-4">' + ICONS.alert + '<span>El programa requiere un <strong>minimo de ' + HORAS_MINIMAS_REQUERIDAS + ' horas</strong> (obligatorios + optativos). Te faltan ' + faltantes + ' horas por cubrir.</span></div>';
  } else {
    warnHtml = '<div class="alert alert-ok mt-4">' + ICONS.check + '<span>Cumples con el requerimiento de horas de capacitacion (' + totalGeneral + ' h totales).</span></div>';
  }

  return (
    '<div class="card">' +
      '<div class="card-title">' + ICONS.shield + ' Cursos Obligatorios Institucionales 2027</div>' +
      '<p class="card-subtitle">Precargados por lineamiento normativo (' + totalOblig + ' horas acumuladas).</p>' +
      '<div class="grid2">' + obligHtml + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title">' + ICONS.book + ' Seleccion de Cursos Optativos</div>' +
      '<p class="card-subtitle">Filtra por categoria y selecciona el curso y plataforma que responda a tus funciones. Ambos componentes (obligatorios y optativos) deben sumar al menos ' + HORAS_MINIMAS_REQUERIDAS + ' horas.</p>' +
      renderCourseSelector(1, state.c1_cat, state.c1_nom, state.c1_id, state.c2_id, disponibles) +
      renderCourseSelector(2, state.c2_cat, state.c2_nom, state.c2_id, state.c1_id, disponibles) +
      warnHtml +
    '</div>' +
    '<div class="card">' +
      '<div class="card-title" style="font-size:14px;">' + ICONS.info + ' Normatividad y Lineamientos</div>' +
      '<div class="norm-box">De conformidad con las disposiciones del Programa Anual de Capacitacion y Profesionalizacion de la SEDATU, el personal podra acreditar las horas establecidas mediante las plataformas oficiales autorizadas. Toda solicitud remitida queda sujeta a la validacion de la DGCHDO.</div>' +
    '</div>' +
    '<div class="total-bar mt-4 mb-4">' +
      '<span>Total acumulado de capacitacion:</span>' +
      '<strong style="color:var(--teal-900);font-size:16px;">' + totalGeneral + ' horas ' + (cumpleMinimo ? '(Cumple minimo)' : '') + '</strong>' +
    '</div>' +
    '<button class="btn btn-primary" id="submit-btn" ' + (puedeEnviar ? "" : "disabled") + '>' + ICONS.clip + ' Registrar solicitud de capacitacion 2027</button>'
  );
}

function renderConfirmacion() {
  var record = state.record;
  var cursosRows = record.cursosObligatorios.map(function (c) {
    return '<tr><td>' + esc(c.nombre) + '<div style="font-size:11px;color:var(--stone-500);">' + esc(c.plataforma) + '</div></td><td style="color:var(--amber-700);">Obligatorio</td><td>' + c.horas + ' h</td></tr>';
  }).join("") + record.cursosSolicitados.map(function (c) {
    return '<tr><td>' + esc(c.nombre) + '<div style="font-size:11px;color:var(--stone-500);">' + esc(c.plataforma) + ' &bull; <em>' + esc(c.necesidad) + '</em></div></td><td style="color:var(--teal-700);">Optativo</td><td>' + c.horas + ' h</td></tr>';
  }).join("");

  return (
    '<div class="alert alert-ok mb-4 no-print">' + ICONS.check + '<span>Solicitud registrada exitosamente. Puedes imprimir o guardar el comprobante en PDF.</span></div>' +
    '<div class="card">' +
      '<div class="doc-header">' +
        '<div><div class="doc-eyebrow">SEDATU</div><div class="doc-title">Cedula Individual de Deteccion de Necesidades &mdash; Ciclo ' + esc(record.cicloCapacitacion) + '</div></div>' +
        '<div class="doc-meta"><div>Folio: ' + esc(record.numEmpleado) + '-' + esc(record.fechaSolicitud) + '</div><div>Fecha: ' + esc(record.fechaSolicitud) + '</div></div>' +
      '</div>' +
      '<div class="field-label">Datos del Servidor Publico</div>' +
      '<div class="grid2 mb-6 mt-2">' +
        '<div><span style="color:var(--stone-400);">Nombre: </span>' + esc(record.nombre) + '</div>' +
        '<div><span style="color:var(--stone-400);">CURP: </span>' + esc(record.curp) + '</div>' +
        '<div><span style="color:var(--stone-400);">Numero de empleado: </span>' + esc(record.numEmpleado) + '</div>' +
        '<div><span style="color:var(--stone-400);">Tipo de puesto: </span>' + esc(record.puesto) + '</div>' +
        '<div><span style="color:var(--stone-400);">Nivel: </span>' + esc(record.nivel) + '</div>' +
        '<div class="col-span-2"><span style="color:var(--stone-400);">Area de adscripcion: </span>' + esc(record.area) + '</div>' +
      '</div>' +
      '<div class="field-label">Programa de Capacitacion Seleccionado</div>' +
      '<table class="mb-2 mt-2"><thead><tr><th>Curso y Plataforma</th><th>Tipo</th><th>Horas</th></tr></thead><tbody>' + cursosRows + '</tbody>' +
      '<tfoot><tr><td colspan="2" style="text-align:right;font-weight:600;color:var(--stone-600);">Horas Totales Programadas</td><td style="font-weight:700;color:var(--teal-900);">' + record.totalHorasSolicitud + ' h</td></tr></tfoot></table>' +
      '<div class="mb-8 mt-8 no-print">' +
        '<div class="field-label">Nombre del superior jerarquico inmediato (para autorizacion)</div>' +
        '<input type="text" id="jefe-input" placeholder="Nombre completo del titular que autoriza" style="max-width:380px;" value="' + esc(state.jefeInmediato) + '" />' +
      '</div>' +
      '<div class="field-label mt-8">Firmas de Conformidad</div>' +
      '<div class="signature-row">' +
        '<div class="signature-box"><div class="signature-name">' + esc(record.nombre) + '</div><div class="signature-label">' + ICONS.pen + ' Nombre y firma del servidor publico solicitante</div></div>' +
        '<div class="signature-box"><div class="signature-name">' + (esc(state.jefeInmediato) || '&nbsp;') + '</div><div class="signature-label">' + ICONS.pen + ' Nombre y firma del superior jerarquico (autoriza)</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="btn-row mt-4 no-print">' +
      '<button type="button" class="btn btn-primary" id="btn-print">' + ICONS.printer + ' Imprimir comprobante</button>' +
      '<button type="button" class="btn btn-secondary" data-action="logout">Finalizar y salir</button>' +
    '</div>'
  );
}

/* ============================================================
   RENDER PRINCIPAL Y CONTROLADORES
   ============================================================ */
function render() {
  var stepCurrent = state.page === "login" ? 1 : state.page === "perfil" ? 2 : state.page === "solicitud" ? 3 : 4;
  var pageHtml = "";
  if (state.page === "login") pageHtml = renderLogin();
  else if (state.page === "perfil" && state.user) pageHtml = renderPerfil();
  else if (state.page === "solicitud" && state.user) pageHtml = renderSolicitud();
  else if (state.page === "confirmacion" && state.record) pageHtml = renderConfirmacion();

  document.getElementById("root").innerHTML =
    renderHeader() +
    '<div class="container">' +
      renderStepper(stepCurrent) +
      pageHtml +
    '</div>' +
    '<div class="footer no-print">SEDATU &middot; Direccion General de Capital Humano y Desarrollo Organizacional &middot; Maqueta Funcional</div>';

  attachListeners();
}

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function attachListeners() {
  var root = document.getElementById("root");

  // Login
  var loginForm = document.getElementById("login-form");
  if (loginForm) {
    loginForm.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var curp = document.getElementById("curp-input").value.trim().toUpperCase();
      var num = document.getElementById("numempleado-input").value.trim();
      var found = EMPLEADOS.filter(function (e) { return e.curp === curp && e.numEmpleado === num; })[0];
      if (!found) {
        setState({ curp: curp, numEmpleado: num, loginError: "CURP o numero de empleado no coinciden con el padron. Verifica tus datos." });
        return;
      }
      setState({ curp: curp, numEmpleado: num, loginError: "", user: found, page: "perfil" });
    });
    document.getElementById("curp-input").addEventListener("input", function (e) { state.curp = e.target.value.toUpperCase(); });
    document.getElementById("numempleado-input").addEventListener("input", function (e) { state.numEmpleado = e.target.value; });
  }

  // Selectores Cascada
  var catSelects = document.querySelectorAll(".cat-select");
  catSelects.forEach(function (sel) {
    sel.addEventListener("change", function (e) {
      var slot = e.target.getAttribute("data-slot");
      if (slot === "1") {
        setState({ c1_cat: e.target.value, c1_nom: "", c1_id: "" });
      } else {
        setState({ c2_cat: e.target.value, c2_nom: "", c2_id: "" });
      }
    });
  });

  var nomSelects = document.querySelectorAll(".nom-select");
  nomSelects.forEach(function (sel) {
    sel.addEventListener("change", function (e) {
      var slot = e.target.getAttribute("data-slot");
      if (slot === "1") {
        setState({ c1_nom: e.target.value, c1_id: "" });
      } else {
        setState({ c2_nom: e.target.value, c2_id: "" });
      }
    });
  });

  var idSelects = document.querySelectorAll(".id-select");
  idSelects.forEach(function (sel) {
    sel.addEventListener("change", function (e) {
      var slot = e.target.getAttribute("data-slot");
      if (slot === "1") {
        setState({ c1_id: e.target.value });
      } else {
        setState({ c2_id: e.target.value });
      }
    });
  });

  // Envío Solicitud
  var submitBtn = document.getElementById("submit-btn");
  if (submitBtn) {
    submitBtn.addEventListener("click", function () {
      var disponibles = getDisponibles2027(state.user);
      var c1 = disponibles.filter(function (c) { return String(c.id) === String(state.c1_id); })[0];
      var c2 = disponibles.filter(function (c) { return String(c.id) === String(state.c2_id); })[0];
      var totalOblig = OBLIGATORIOS_2027.reduce(function (a, c) { return a + c.horas; }, 0);

      var record = {
        cicloCapacitacion: "2027",
        numEmpleado: state.user.numEmpleado,
        curp: state.user.curp,
        nombre: state.user.nombre,
        puesto: state.user.puesto,
        nivel: state.user.nivel,
        area: state.user.area,
        cursosObligatorios: OBLIGATORIOS_2027,
        cursosSolicitados: [c1, c2],
        totalHorasSolicitud: totalOblig + c1.horas + c2.horas,
        fechaSolicitud: new Date().toISOString().slice(0, 10),
        estado: "Registrada"
      };
      setState({ record: record, page: "confirmacion" });
    });
  }

  // Nombre de Jefe
  var jefeInput = document.getElementById("jefe-input");
  if (jefeInput) {
    jefeInput.addEventListener("input", function (e) {
      state.jefeInmediato = e.target.value;
      var nameEls = document.querySelectorAll(".signature-box .signature-name");
      if (nameEls[1]) nameEls[1].innerHTML = esc(e.target.value) || "&nbsp;";
    });
  }

  // Impresión Segura sin bucle de recarga
  var printBtn = document.getElementById("btn-print");
  if (printBtn) {
    printBtn.addEventListener("click", function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      setTimeout(function () {
        window.print();
      }, 50);
    });
  }

  // Botones de acción general
  root.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (action === "logout") {
      setState({
        user: null, curp: "", numEmpleado: "", loginError: "",
        c1_cat: "", c1_nom: "", c1_id: "",
        c2_cat: "", c2_nom: "", c2_id: "",
        jefeInmediato: "", record: null, page: "login"
      });
    } else if (action === "go-solicitud") {
      setState({ page: "solicitud" });
    } else if (action === "fill-account") {
      setState({ curp: el.getAttribute("data-curp"), numEmpleado: el.getAttribute("data-num"), loginError: "" });
    }
  });
}

render();
})();
</script>
</body>
</html>
